<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>양지파인리조트 스마트 시설관리 대시보드</title>
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <style>
        body { font-family: 'Arial', sans-serif; margin: 40px; background-color: #f4f7f6; }
        #calendar { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .fc-toolbar-title { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏢 양지파인리조트 연간 시설관리 대시보드</h1>
    <p style="text-align: center; color: #666;">연간 법정점검 및 주간 업무 현황</p>
    <div id='calendar'></div>

    <!-- FullCalendar Script -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
   <script type="module">
        // 1. Firebase 라이브러리 불러오기
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        // 2. 황박사님의 프로젝트 인증 정보 (마스터 키)
        const firebaseConfig = {
            apiKey: "AIzaSyAya2NJtmNLJtiP7XMOdj7o1wkusf7n3fY",
            authDomain: "smart-facility-dashboard-52577.firebaseapp.com",
            projectId: "smart-facility-dashboard-52577",
            storageBucket: "smart-facility-dashboard-52577.firebasestorage.app",
            messagingSenderId: "934422884508",
            appId: "1:934422884508:web:ac19e9a72afa1374e6bd59"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async function() {
            var calendarEl = document.getElementById('calendar');
            
            // 3. Firebase에서 실시간 데이터 읽어오기
            const tasksCol = collection(db, 'tasks');
            const taskSnapshot = await getDocs(tasksCol);
            const eventsData = taskSnapshot.docs.map(doc => {
                let data = doc.data();
                return {
                    title: data.title,
                    start: data.date,
                    color: data.color
                };
            });

            // 4. FullCalendar에 데이터 그리기
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridYear,dayGridMonth,timeGridWeek'
                },
                buttonText: { year: '연간', month: '월간', week: '주간', today: '오늘' },
                events: eventsData
            });
            calendar.render();
        });
    </script>
</body>
</html>
