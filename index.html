<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        // 💡 updateDoc 기능이 추가되었습니다.
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        // 황박사님의 프로젝트 마스터 키
        const firebaseConfig = {
            apiKey: "AIzaSyAya2NJtmNLJtiP7XMOdj7o1wkusf7n3fY",
            authDomain: "smart-facility-dashboard-52577.firebaseapp.com",
            projectId: "smart-facility-dashboard-52577",
            storageBucket: "smart-facility-dashboard-52577.firebasestorage.app",
            messagingSenderId: "934422884508",
            appId: "1:934422884508:web:ac19e9a72afa1374e6bd59"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async function() {
            var calendarEl = document.getElementById('calendar');
            
            const tasksCol = collection(db, 'tasks');
            const taskSnapshot = await getDocs(tasksCol);
            const eventsData = taskSnapshot.docs.map(doc => {
                let data = doc.data();
                return {
                    id: doc.id,
                    title: data.title,
                    start: data.date,
                    color: data.color,
                    extendedProps: { cycle: data.cycle, rawName: data.rawName, manager: data.manager }
                };
            });

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridYear,dayGridMonth' },
                events: eventsData,
                editable: true, // 💡 마우스로 일정 끌어다 놓기(드래그) 허용!

                // 🌟 기능 1: 달력의 빈 날짜를 클릭했을 때 (신규 등록)
                dateClick: async function(info) {
                    const dateStr = info.dateStr;
                    const taskName = prompt(`[${dateStr}] 추가할 점검/업무명을 입력하세요:`);
                    if (!taskName) return;

                    const cycle = prompt("몇 개월 주기로 반복하시겠습니까? (예: 12, 반복 없으면 0)", "12");
                    if (cycle === null) return;

                    // 기본 담당자 이름을 황박사로 띄워줍니다.
                    const manager = prompt("작성자(담당자) 이름을 입력하세요:", "황박사");
                    if (!manager) return;

                    // 클릭한 날짜가 오늘보다 과거인지 미래인지 판단
                    const isPast = new Date(dateStr) < new Date();
                    const statusStr = isPast ? "✅ [완료]" : "🚨 [예정]";
                    const colorStr = isPast ? "#a0a0a0" : "#d9534f";
                    const docPrefix = isPast ? "done" : "todo";

                    const docId = `${docPrefix}_${taskName}_${dateStr}`;
                    
                    // 1. 클릭한 날짜에 일정 저장 (담당자 이름 포함)
                    await setDoc(doc(db, "tasks", docId), {
                        title: `${statusStr} ${taskName} (${manager})`,
                        date: dateStr,
                        color: colorStr,
                        cycle: parseInt(cycle) || 0,
                        rawName: taskName,
                        manager: manager
                    });

                    // 2. 과거 완료된 일이고 주기가 있다면 -> 내년 예정일 자동 세팅!
                    if (isPast && parseInt(cycle) > 0) {
                        let nextDateObj = new Date(dateStr);
                        nextDateObj.setMonth(nextDateObj.getMonth() + parseInt(cycle));
                        const nextDateStr = nextDateObj.toISOString().split('T')[0];
                        
                        await setDoc(doc(db, "tasks", `todo_${taskName}_${nextDateStr}`), {
                            title: `🚨 [예정] ${taskName} (정기) (${manager})`,
                            date: nextDateStr,
                            color: '#d9534f',
                            cycle: parseInt(cycle),
                            rawName: taskName,
                            manager: manager
                        });
                    }
                    location.reload(); // 화면 새로고침
                },

                // 🌟 기능 2: 일정을 마우스로 끌어서 다른 날짜로 옮길 때 (일정 변경)
                eventDrop: async function(info) {
                    const eventId = info.event.id;
                    const newDateStr = info.event.startStr.split('T')[0];
                    const isConfirm = confirm(`일정을 ${newDateStr}로 미루거나 변경하시겠습니까?`);

                    if (isConfirm) {
                        await updateDoc(doc(db, "tasks", eventId), { date: newDateStr });
                    } else {
                        info.revert(); // 취소하면 원래 날짜로 쏙 돌아감
                    }
                },

                // 🌟 기능 3: 만들어진 일정을 클릭했을 때 (완료 처리 및 삭제)
                eventClick: async function(info) {
                    const eventId = info.event.id;
                    const title = info.event.title;
                    const props = info.event.extendedProps;

                    if (title.includes('예정')) {
                        const isDone = confirm(`[${props.rawName}]\n이 업무를 오늘 완료하셨습니까?\n\n- 확인: 완료 처리 및 다음 주기 생성\n- 취소: 이 일정 삭제`);
                        if (isDone) {
                            const today = new Date().toISOString().split('T')[0];
                            const actualDate = prompt("실제 점검 완료 날짜:", today);
                            if (actualDate) {
                                await deleteDoc(doc(db, "tasks", eventId));
                                await setDoc(doc(db, "tasks", `done_${props.rawName}_${actualDate}`), {
                                    title: `✅ [완료] ${props.rawName} (${props.manager})`, date: actualDate, color: '#a0a0a0', cycle: props.cycle, rawName: props.rawName, manager: props.manager
                                });
                                
                                if(props.cycle > 0) {
                                    let nextDateObj = new Date(actualDate);
                                    nextDateObj.setMonth(nextDateObj.getMonth() + parseInt(props.cycle));
                                    const nextDateStr = nextDateObj.toISOString().split('T')[0];
                                    await setDoc(doc(db, "tasks", `todo_${props.rawName}_${nextDateStr}`), {
                                        title: `🚨 [예정] ${props.rawName} (정기) (${props.manager})`, date: nextDateStr, color: '#d9534f', cycle: props.cycle, rawName: props.rawName, manager: props.manager
                                    });
                                }
                                location.reload();
                            }
                        } else {
                            if(confirm("일정을 완전히 삭제하시겠습니까?")) { await deleteDoc(doc(db, "tasks", eventId)); location.reload(); }
                        }
                    } else {
                        if(confirm(`'${title}' 기록을 삭제하시겠습니까?`)) { await deleteDoc(doc(db, "tasks", eventId)); location.reload(); }
                    }
                }
            });
            calendar.render();
        });
    </script>
