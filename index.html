<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>양지파인리조트 스마트 시설관리 대시보드</title>
    <!-- FullCalendar & SweetAlert2 -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 20px; background-color: #f4f7f6; }
        /* 💡 로그인이 통과되기 전까지 대시보드 화면을 숨깁니다 */
        #app-container { display: none; }
        
        #calendar { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .toolbar { text-align: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; margin: 0 5px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-upload { background-color: #28a745; }
        .btn-download { background-color: #17a2b8; }
        .btn-print { background-color: #6c757d; }
        .btn-logout { background-color: #dc3545; float: right; }
        
        @media print {
            .toolbar { display: none; }
            body { background-color: white; margin: 0; }
            #calendar { box-shadow: none; width: 100%; max-width: 100%; }
        }
        .swal2-input, .swal2-select { margin: 10px auto; width: 80%; }
    </style>
</head>
<body>
    
    <!-- 💡 로그인 성공 시 보여질 전체 대시보드 영역 -->
    <div id="app-container">
        <h1>🏢 양지파인리조트 연간 시설관리 대시보드</h1>
        
        <div class="toolbar">
            <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
            <button class="btn btn-upload" id="uploadBtn">📂 엑셀 업로드</button>
            <button class="btn btn-download" id="downloadBtn">💾 엑셀 백업</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ 인쇄하기</button>
            <button class="btn btn-logout" id="logoutBtn">🔒 로그아웃</button>
        </div>

        <div id='calendar'></div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script type="module">
        // ==========================================
        // 🔐 천재적인 다중 사용자 로그인 시스템
        // 원하시는 만큼 계정을 아래에 추가하거나 수정하세요!
        // ==========================================
        const USERS = {
            'admin': { pw: '8899', name: '황박사' },   // 아이디: admin, 비번: 8899
            'team1': { pw: '1234', name: '김팀장' },   // 아이디: team1, 비번: 1234
            'staff': { pw: '5678', name: '이주임' }    // 아이디: staff, 비번: 5678
        };

        // 로그인 확인 함수
        async function checkLogin() {
            const savedId = localStorage.getItem('pine_id');
            const savedPw = localStorage.getItem('pine_pw');
            
            // 이미 로그인되어 있고 정보가 맞다면 바로 통과!
            if (savedId && savedPw && USERS[savedId] && USERS[savedId].pw === savedPw) {
                return USERS[savedId].name; 
            }

            // 로그인이 안 되어 있다면 예쁜 팝업창 띄우기
            while (true) {
                const { value: formValues } = await Swal.fire({
                    title: '양지파인리조트 시설관리',
                    html:
                        '<input id="swal-id" class="swal2-input" placeholder="아이디 입력">' +
                        '<input id="swal-pw" type="password" class="swal2-input" placeholder="비밀번호 입력">',
                    focusConfirm: false,
                    allowOutsideClick: false, 
                    allowEscapeKey: false,
                    confirmButtonText: '로그인',
                    preConfirm: () => {
                        return {
                            id: document.getElementById('swal-id').value.trim(),
                            pw: document.getElementById('swal-pw').value.trim()
                        }
                    }
                });

                if (formValues) {
                    const user = USERS[formValues.id];
                    if (user && user.pw === formValues.pw) {
                        // 로그인 성공 시 폰에 기억시킴
                        localStorage.setItem('pine_id', formValues.id);
                        localStorage.setItem('pine_pw', formValues.pw);
                        await Swal.fire({ title: '로그인 성공', text: `${user.name}님 환영합니다!`, icon: 'success', timer: 1500, showConfirmButton: false });
                        return user.name; // 접속한 사람의 이름 반환
                    } else {
                        await Swal.fire('로그인 실패', '아이디 또는 비밀번호가 틀렸습니다.', 'error');
                    }
                }
            }
        }

        // ==========================================
        // 🚀 대시보드 메인 로직 시작
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAya2NJtmNLJtiP7XMOdj7o1wkusf7n3fY",
            authDomain: "smart-facility-dashboard-52577.firebaseapp.com",
            projectId: "smart-facility-dashboard-52577",
            storageBucket: "smart-facility-dashboard-52577.firebasestorage.app",
            messagingSenderId: "934422884508",
            appId: "1:934422884508:web:ac19e9a72afa1374e6bd59"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CAT_CONFIG = {
            '법정': { icon: '🚨', color: '#d9534f' },
            '보수': { icon: '🛠️', color: '#fd7e14' },
            '일반': { icon: '📋', color: '#0275d8' }
        };

        function calcNextDate(dateString, cycleMonths) {
            if (!cycleMonths || cycleMonths <= 0) return null;
            let [year, month, day] = dateString.split('-').map(Number);
            let nextDate = new Date(year, month - 1 + parseInt(cycleMonths), day);
            if (nextDate.getDate() !== day) { nextDate.setDate(0); }
            const y = nextDate.getFullYear();
            const m = String(nextDate.getMonth() + 1).padStart(2, '0');
            const d = String(nextDate.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            // 1. 천재적인 로그인 체크 먼저 실행
            const currentUser = await checkLogin();
            
            // 2. 로그인이 통과되면 하얗게 숨겨뒀던 화면을 짠! 하고 보여줌
            document.getElementById('app-container').style.display = 'block';

            // 3. 로그아웃 버튼 기능 연결
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('pine_id');
                localStorage.removeItem('pine_pw');
                location.reload();
            });

            var calendarEl = document.getElementById('calendar');
            
            try {
                const tasksCol = collection(db, 'tasks');
                const taskSnapshot = await getDocs(tasksCol);
                const eventsData = taskSnapshot.docs.map(doc => {
                    let data = doc.data();
                    return {
                        id: doc.id, title: data.title, start: data.date, color: data.color,
                        extendedProps: { cycle: data.cycle, rawName: data.rawName, manager: data.manager, category: data.category || '법정' }
                    };
                });

                var calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridYear,dayGridMonth' },
                    events: eventsData,
                    editable: true,
                    
                    // 신규 일정 등록
                    dateClick: async function(info) {
                        const { value: formValues } = await Swal.fire({
                            title: `[${info.dateStr}] 신규 등록`,
                            html:
                                `<input id="swal-name" class="swal2-input" placeholder="업무명 (예: 소독, 냉동기 점검)">` +
                                `<select id="swal-cat" class="swal2-select">
                                    <option value="법정">🚨 법정/필수점검 (빨강)</option>
                                    <option value="보수">🛠️ 시설보수/수리 (주황)</option>
                                    <option value="일반">📋 일반/임시점검 (파랑)</option>
                                </select>` +
                                `<input id="swal-cycle" type="number" min="0" class="swal2-input" placeholder="주기(개월)" value="12">` +
                                `<input id="swal-manager" class="swal2-input" value="${currentUser}" placeholder="담당자">`, // 💡 로그인한 사람 이름 자동 입력!
                            focusConfirm: false, showCancelButton: true, confirmButtonText: '등록',
                            preConfirm: () => {
                                return {
                                    name: document.getElementById('swal-name').value, cat: document.getElementById('swal-cat').value,
                                    cycle: document.getElementById('swal-cycle').value || 0, manager: document.getElementById('swal-manager').value
                                }
                            }
                        });

                        if (formValues && formValues.name) {
                            const isPast = new Date(info.dateStr) < new Date();
                            const docId = `${isPast ? "done" : "todo"}_${formValues.name}_${info.dateStr}`;
                            const catInfo = CAT_CONFIG[formValues.cat];
                            
                            await setDoc(doc(db, "tasks", docId), {
                                title: isPast ? `✅ [완료] ${formValues.name} (${formValues.manager})` : `${catInfo.icon} [예정] ${formValues.name} (${formValues.manager})`,
                                date: info.dateStr, color: isPast ? "#a0a0a0" : catInfo.color, cycle: parseInt(formValues.cycle), 
                                rawName: formValues.name, manager: formValues.manager, category: formValues.cat
                            });

                            if (isPast && parseInt(formValues.cycle) > 0) {
                                const nextDateStr = calcNextDate(info.dateStr, formValues.cycle);
                                await setDoc(doc(db, "tasks", `todo_${formValues.name}_${nextDateStr}`), {
                                    title: `${catInfo.icon} [예정] ${formValues.name} (${formValues.manager})`, 
                                    date: nextDateStr, color: catInfo.color, cycle: parseInt(formValues.cycle), 
                                    rawName: formValues.name, manager: formValues.manager, category: formValues.cat
                                });
                                Swal.fire('등록 완료', '실적이 저장되었으며 다음 예정일이 자동 생성되었습니다.', 'success').then(()=>location.reload());
                            } else {
                                Swal.fire({title: '예정 일정 등록됨', text: '예정일이 생성되었습니다. 추후 [✅ 완료 처리] 시 다음 주기가 시작됩니다.', icon: 'info'}).then(()=>location.reload());
                            }
                        }
                    },

                    eventDrop: async function(info) {
                        const newDate = info.event.startStr.split('T')[0];
                        const result = await Swal.fire({ title: '일정 변경', text: `${newDate}로 일정을 이동하시겠습니까?`, icon: 'question', showCancelButton: true });
                        if (result.isConfirmed) { await updateDoc(doc(db, "tasks", info.event.id), { date: newDate }); } 
                        else { info.revert(); }
                    },

                    eventClick: async function(info) {
                        const p = info.event.extendedProps;
                        const isDone = info.event.title.includes('완료');
                        
                        const action = await Swal.fire({
                            title: `'${p.rawName}'`, text: '무엇을 하시겠습니까?', icon: 'info',
                            showDenyButton: true, showCancelButton: true,
                            confirmButtonColor: '#28a745', denyButtonColor: '#007bff', cancelButtonColor: '#dc3545',
                            confirmButtonText: isDone ? '확인 (닫기)' : '✅ 완료 처리',
                            denyButtonText: '✏️ 일정 수정', cancelButtonText: '🗑️ 삭제'
                        });

                        if (action.isConfirmed && !isDone) {
                            const { value: actualDate } = await Swal.fire({ title: '실제 점검 완료일', input: 'date', inputValue: new Date().toISOString().split('T')[0] });
                            if (actualDate) {
                                await deleteDoc(doc(db, "tasks", info.event.id));
                                await setDoc(doc(db, "tasks", `done_${p.rawName}_${actualDate}`), { 
                                    title: `✅ [완료] ${p.rawName} (${currentUser})`, // 💡 누가 완료했는지 자동 기록!
                                    date: actualDate, color: '#a0a0a0', cycle: p.cycle, rawName: p.rawName, manager: currentUser, category: p.category 
                                });
                                
                                if(p.cycle > 0) {
                                    const nextStr = calcNextDate(actualDate, p.cycle);
                                    const catInfo = CAT_CONFIG[p.category];
                                    await setDoc(doc(db, "tasks", `todo_${p.rawName}_${nextStr}`), { 
                                        title: `${catInfo.icon} [예정] ${p.rawName} (${currentUser})`, date: nextStr, color: catInfo.color, cycle: p.cycle, rawName: p.rawName, manager: currentUser, category: p.category 
                                    });
                                }
                                Swal.fire('완료되었습니다!', '다음 주기가 자동으로 생성되었습니다.', 'success').then(() => location.reload());
                            }
                        } 
                        else if (action.isDenied) {
                            const { value: editValues } = await Swal.fire({
                                title: '일정 수정',
                                html:
                                    `<input id="swal-e-name" class="swal2-input" value="${p.rawName}">` +
                                    `<select id="swal-e-cat" class="swal2-select">
                                        <option value="법정" ${p.category==='법정'?'selected':''}>🚨 법정/필수점검</option>
                                        <option value="보수" ${p.category==='보수'?'selected':''}>🛠️ 시설보수/수리</option>
                                        <option value="일반" ${p.category==='일반'?'selected':''}>📋 일반/임시점검</option>
                                    </select>` +
                                    `<input id="swal-e-date" type="date" class="swal2-input" value="${info.event.startStr.split('T')[0]}">` +
                                    `<input id="swal-e-cycle" type="number" min="0" class="swal2-input" value="${p.cycle}">` +
                                    `<input id="swal-e-manager" class="swal2-input" value="${p.manager}">`,
                                focusConfirm: false, showCancelButton: true, confirmButtonText: '저장',
                                preConfirm: () => {
                                    return {
                                        name: document.getElementById('swal-e-name').value, cat: document.getElementById('swal-e-cat').value,
                                        date: document.getElementById('swal-e-date').value, cycle: document.getElementById('swal-e-cycle').value, manager: document.getElementById('swal-e-manager').value
                                    }
                                }
                            });

                            if (editValues) {
                                await deleteDoc(doc(db, "tasks", info.event.id)); 
                                const catInfo = CAT_CONFIG[editValues.cat];
                                const finalColor = isDone ? "#a0a0a0" : catInfo.color;
                                const finalIcon = isDone ? "✅ [완료]" : `${catInfo.icon} [예정]`;
                                const prefix = isDone ? "done" : "todo";

                                await setDoc(doc(db, "tasks", `${prefix}_${editValues.name}_${editValues.date}`), {
                                    title: `${finalIcon} ${editValues.name} (${editValues.manager})`,
                                    date: editValues.date, color: finalColor, cycle: parseInt(editValues.cycle), 
                                    rawName: editValues.name, manager: editValues.manager, category: editValues.cat
                                });
                                location.reload();
                            }
                        }
                        else if (action.dismiss === Swal.DismissReason.cancel) {
                            const delConfirm = await Swal.fire({ title: '삭제하시겠습니까?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' });
                            if(delConfirm.isConfirmed) { await deleteDoc(doc(db, "tasks", info.event.id)); location.reload(); }
                        }
                    }
                });
                calendar.render();

                document.getElementById('downloadBtn').addEventListener('click', function() {
                    let csv = "\uFEFF점검명,분류,날짜,주기(개월),담당자\n";
                    eventsData.forEach(e => { csv += `${e.extendedProps.rawName},${e.extendedProps.category},${e.start},${e.extendedProps.cycle},${e.extendedProps.manager}\n`; });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
                    link.download = "양지파인리조트_스마트일정.csv"; link.click();
                });

                document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('csvFileInput').click());
                document.getElementById('csvFileInput').addEventListener('change', async function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async function(event) {
                        const rows = event.target.result.split('\n');
                        for (let i = 1; i < rows.length; i++) {
                            const cols = rows[i].split(',');
                            if (cols.length < 3 || !cols[0].trim()) continue;
                            const taskName = cols[0].trim(); const dateStr = cols[2].trim(); 
                            const cycle = parseInt(cols[3]) || 0; const manager = cols[4] ? cols[4].trim() : currentUser; // 💡 업로드할 때도 담당자 자동 배정
                            const category = cols[1] ? cols[1].trim() : '법정';
                            
                            const isPast = new Date(dateStr) < new Date();
                            const catInfo = CAT_CONFIG[category] || CAT_CONFIG['법정'];
                            
                            await setDoc(doc(db, "tasks", `${isPast ? 'done' : 'todo'}_${taskName}_${dateStr}`), {
                                title: isPast ? `✅ [완료] ${taskName} (${manager})` : `${catInfo.icon} [예정] ${taskName} (${manager})`,
                                date: dateStr, color: isPast ? "#a0a0a0" : catInfo.color, cycle: cycle, rawName: taskName, manager: manager, category: category
                            });
                            
                            if (isPast && cycle > 0) {
                                const nStr = calcNextDate(dateStr, cycle);
                                await setDoc(doc(db, "tasks", `todo_${taskName}_${nStr}`), { title: `${catInfo.icon} [예정] ${taskName} (${manager})`, date: nStr, color: catInfo.color, cycle: cycle, rawName: taskName, manager: manager, category: category });
                            }
                        }
                        alert("대량 업로드가 완료되었습니다!");
                        location.reload();
                    };
                    reader.readAsText(file, 'utf-8');
                });

            } catch (error) { console.error(error); alert("데이터 로딩 에러"); }
        });
    </script>
</body>
</html>
